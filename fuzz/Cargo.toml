[package]
name = "oxihttp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# `libfuzzer-sys` is a non-published, non-member dev tool: it exists only to
# fuzz the untrusted-input parsers in the main workspace and is never built
# as part of a normal `cargo build`/`cargo test` run.
[package.metadata]
cargo-fuzz = true

# This crate is intentionally its OWN workspace (empty table), not a member
# of the root `oxihttp` workspace, for two reasons: (1) `cargo build
# --workspace` / `cargo nextest run --workspace` at the repo root must not
# need a fuzzing toolchain (typically nightly) to succeed, and (2) none of
# the crates it depends on need an `exclude = ["fuzz"]` in their own
# `[package]` to keep this directory out of their published tarball — it
# simply isn't attached to any published package's manifest at all.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
http = { version = "1.4" }
tokio = { version = "1", features = ["rt", "io-util"] }

[dependencies.oxihttp-core]
path = "../crates/oxihttp-core"

[dependencies.oxihttp-server]
path = "../crates/oxihttp-server"
# `ws_frame` (WebSocket codec) needs `websocket`; `ServeFile` (Range header
# parsing) needs `static-files`.
features = ["websocket", "static-files"]

[[bin]]
name = "cookie_parse"
path = "fuzz_targets/cookie_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frame_read"
path = "fuzz_targets/ws_frame_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart_build"
path = "fuzz_targets/multipart_build.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_header"
path = "fuzz_targets/range_header.rs"
test = false
doc = false
bench = false
